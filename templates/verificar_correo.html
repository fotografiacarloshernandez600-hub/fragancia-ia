{% extends "base.html" %}{% block content %}<section class="formulario-pagina"><div class="formulario"><h1>Verifica tu correo</h1><p>Introduce el código de seis dígitos. Caduca en cinco minutos.</p><form method="POST"><label>Código de seguridad</label><input name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>{% if cambio %}<label>Nueva contraseña</label><input type="password" name="nueva" minlength="6" required><label>Confirmar contraseña</label><input type="password" name="confirmar" minlength="6" required>{% endif %}<button>Verificar</button></form><p><a href="{{ url_for('recuperar' if cambio else 'login') }}">Solicitar otro código</a></p></div></section>{% endblock %}
