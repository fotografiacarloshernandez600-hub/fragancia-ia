{% extends "base.html" %}

{% block content %}
<section class="formulario-pagina">
    <div class="formulario">
        <h1>Iniciar sesión</h1>
        <form method="POST">
            <label>Correo</label>
            <input type="email" name="correo" required>

            <label>Contraseña</label>
            <input type="password" name="contrasena" required>

            <button type="submit">Entrar</button>
        </form>
        <p><a href="{{ url_for('recuperar') }}">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Crear cuenta</a></p>
        <p><a href="{{ url_for('inicio') }}">← Volver al inicio</a></p>
    </div>
</section>
{% endblock %}
