<article class="producto"><div class="producto-visual">{% if p['imagen'] %}<img src="{{ url_for('static',filename='img/'+p['imagen']) }}" alt="{{ p['nombre'] }}" loading="lazy">{% else %}<div class="bottle"><span>FRAG·IA</span></div>{% endif %}<span class="tag">{{ p['categoria']|capitalize }}</span></div><div class="producto-info"><small>{{ p['marca'] or 'Colección exclusiva' }}</small><h3>{{ p['nombre'] }}</h3><div class="producto-bottom"><strong>${{ '{:,.2f}'.format(p['precio']) }}</strong>{% if p['stock']>0 %}<form method="post" action="{{ url_for('carrito_agregar',id=p['id']) }}"><button class="icon-btn" title="Agregar a la bolsa" aria-label="Agregar {{ p['nombre'] }} al carrito">＋</button></form>{% else %}<span class="agotado">Agotado</span>{% endif %}</div></div></article>
